# Xiaomi Mi 10 -- SM8250 / Kona. HackiOS port target.
NAME="Xiaomi Mi 10 (umi)"
KIND=phone
SOC="Qualcomm Snapdragon 865 (SM8250)"

UEFI_TARGET=umi
UEFI_FD=
DTB=
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000

FB_BASE=0x9C000000              # 1080 x 2340; Display Reserved region in Kona memmap
WIFI_ATH11K=0                   # QCA6390, not WCN6750

# bootcpu=7: run on the prime (big) core; cpus=8: all cores
BOOTARGS="bootcpu=7 cpus=8"
DEFAULT_SECS=900
USERLAND_VARS=""
# Taken from the phone's Android with adb (see README.md, "On the phone")
FIRMWARE="fw-gpu fw-haptic"